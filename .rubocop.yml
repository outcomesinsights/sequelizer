# The fleet's ruled RuboCop config (gator/standard/rubocop.yml, seed gator-rga.1).
# Only plugins, TargetRubyVersion and Exclude are per repo.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }
plugins: [rubocop-minitest, rubocop-rake, rubocop-sequel]
Lint:
  Enabled: true
AllCops:
  NewCops: disable
  TargetRubyVersion: 3.3
  Exclude: [vendor/**/*, bin/**/*, tmp/**/*, claude_stuff/**/*]
