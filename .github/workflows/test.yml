name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The justfile is the interface: every gate step runs a recipe, never a tool directly.
# lint + test together cover `just ci` (fmt-check lint test hygiene). Each job starts
# with the fleet's tool-setup prelude: checkout, mise-action (the tools in mise.toml),
# setup-just, `just setup`. ruby/setup-ruby stays, ahead of
# `just setup`, so the job's Ruby and bundle are in place and setup's `bundle install`
# is a no-op over bundler-cache.
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth 0: `cog check --from-latest-tag` in `lint` needs the history and the
      # tags; a shallow clone errors "unable to get any tag".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1" # mise.toml's pin
      - run: just setup
      - run: just fmt-check lint hygiene

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    name: Test Ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1" # mise.toml's pin
      - run: just setup
      - run: just test

  # The check branch protection requires and release.yml trusts. Green means every
  # needed job RAN and passed: anything but success fails it, including skipped
  # (a gate that passes by not running), cancelled, and any future state.
  Run-Tests:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [[ -z "$RESULTS" ]]; then
            echo "no needed job results; refusing to report green"
            exit 1
          fi
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "a needed job ended '$result'; refusing to report green"
              exit 1
            fi
          done
          echo "All CI jobs passed"
